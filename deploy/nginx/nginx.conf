# Nginx reverse proxy configuration for QuickTunnel
# Supports wildcard TLS, Server-Sent Events (SSE), and WebSockets

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream to QuickTunnel Server HTTP proxy port
    upstream quicktunnel_http {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name *.tunnel.example.com tunnel.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name *.tunnel.example.com tunnel.example.com;

        ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://quicktunnel_http;
            proxy_http_version 1.1;

            # Preserve Host header and visitor headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket and SSE support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable proxy buffering for low-latency streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
