[workspace]
resolver = "2"
members = [
    "crates/qt-proto",
    "crates/qt-mux",
    "crates/qt-server",
    "crates/qt-client",
    "crates/qt-inspector-ui",
    "crates/quicktunnel",
    "fuzz",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["quicktunnel contributors"]
repository = "https://github.com/quicktunnel/quicktunnel"

[workspace.dependencies]
# Core async
tokio = { version = "1.38", features = ["full", "tokio-macros"] }
bytes = "1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Crypto
rustls = { version = "0.23", features = ["std", "tls12", "logging", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", features = ["ring", "tls12"] }
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
rand = { version = "0.8", features = ["std", "getrandom"] }
subtle = "2.5"
crc32fast = "1.3"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# HTTP
httparse = "1.8"
http = "1.1"
http-body = "1.0"
hyper = { version = "1.2", features = ["full", "http1", "http2"] }

# Testing
proptest = { version = "1.4", features = ["std"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Utilities
dashmap = "5.5"
parking_lot = "0.12"
arc-swap = "1.6"
ulid = "3.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"